<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Nilai — EduKids</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="topnav" id="nav-root"></div>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Nilai</h1>
    <p class="page-sub">Rekap seluruh pengerjaan quiz. Anak tidak bisa melihat halaman ini.</p>
  </div>

  <div class="grid grid-2">
    <select id="filter-quiz" style="width:auto;"></select>
    <select id="filter-anak" style="width:auto;"></select>
  </div>

  <div class="card">
    <strong style="font-size:14px; display:block; margin-bottom:12px;"><i class="ti ti-trophy"></i> Leaderboard keseluruhan</strong>
    <div id="leaderboard-list"><p class="text-muted">Memuat...</p></div>
  </div>

  <div class="card">
    <strong style="font-size:14px; display:block; margin-bottom:12px;">Rekap nilai</strong>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Anak</th><th>Quiz</th><th>Nilai</th><th>Benar/Total</th><th>Tanggal</th></tr>
        </thead>
        <tbody id="nilai-table-body">
          <tr><td colspan="5" class="text-muted">Memuat...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/util.js"></script>
<script src="js/adminAuth.js"></script>
<script src="js/nav.js"></script>
<script src="js/nilai.js"></script>
</body>
</html>

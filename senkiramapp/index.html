<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Masuk — EduKids</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container" style="max-width: 380px; padding-top: 60px;">
  <div class="text-center mt-16" style="margin-bottom: 24px;">
    <div class="nav-brand" style="justify-content:center; font-size: 22px;">
      <i class="ti ti-school"></i> EduKids
    </div>
    <p class="page-sub">Platform assessment akademik anak</p>
  </div>

  <div class="card">
    <div id="banner-area"></div>
    <form id="login-form">
      <label for="password">Password admin</label>
      <input type="password" id="password" placeholder="••••••••" required autofocus />

      <button type="submit" class="btn btn-primary btn-block" id="login-btn">
        <i class="ti ti-lock"></i> Masuk
      </button>
    </form>
  </div>

  <p class="text-center text-muted" style="font-size: 12px;">
    Halaman ini hanya untuk admin. Anak-anak tidak perlu masuk ke sini —
    mereka memakai link quiz yang kamu bagikan langsung.
  </p>
</div>

<script src="js/config.js"></script>
<script src="js/adminAuth.js"></script>
<script>
  if (EK.isAdmin()) {
    window.location.href = 'dashboard.html';
  }

  function showBanner(type, msg) {
    document.getElementById('banner-area').innerHTML = '<div class="banner banner-' + type + '">' + msg + '</div>';
  }

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const pw = document.getElementById('password').value;
    if (EK.checkPassword(pw)) {
      EK.setAdminSession();
      window.location.href = 'dashboard.html';
    } else {
      showBanner('error', 'Password salah. Coba lagi.');
    }
  });
</script>
</body>
</html>

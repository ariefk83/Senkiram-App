<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Quiz — EduKids</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="container" style="max-width: 560px;">

  <div class="text-center mt-16" style="padding-top: 20px; margin-bottom: 8px;">
    <div class="nav-brand" style="justify-content:center; font-size: 18px;">
      <i class="ti ti-school"></i> EduKids
    </div>
  </div>

  <div id="loading-state" class="text-center" style="padding-top:40px;">
    <p class="text-muted">Memuat quiz...</p>
  </div>

  <!-- INTRO -->
  <div id="intro-screen" class="hidden">
    <div class="page-header">
      <h1 class="page-title" id="intro-judul"></h1>
      <p class="page-sub"><span id="intro-kelas-badge" class="badge badge-muted" style="margin-right:6px;"></span>Halo, <strong id="intro-nama-anak"></strong>!</p>
    </div>
    <div class="card">
      <p id="intro-deskripsi" class="text-muted"></p>
      <div style="display:flex; gap:16px; font-size:13px; color:var(--text-secondary); margin-bottom:16px;">
        <span><i class="ti ti-file-text"></i> <span id="intro-jumlah-soal"></span> soal</span>
        <span id="intro-waktu-wrap" class="hidden"><i class="ti ti-clock"></i> <span id="intro-waktu"></span> menit</span>
      </div>
      <div id="intro-riwayat" class="hidden" style="font-size:12px; color:var(--text-muted); margin-bottom:12px;"></div>
      <button class="btn btn-primary btn-block" id="mulai-btn"><i class="ti ti-player-play"></i> Mulai quiz</button>
    </div>
  </div>

  <!-- PLAYING -->
  <div id="play-screen" class="hidden">
    <div class="progress-track"><div class="progress-fill" id="q-progress" style="width:0%;"></div></div>
    <div class="flex-between" style="margin-bottom:16px;">
      <span class="text-muted" id="q-num" style="font-size:13px;"></span>
      <span id="timer-wrap" class="hidden timer-badge"><i class="ti ti-clock"></i> <span id="timer-display"></span></span>
    </div>
    <h2 id="q-question" style="font-size:17px; margin-bottom:20px;"></h2>
    <div id="q-options"></div>
    <button class="btn btn-primary btn-block mt-16" id="next-btn" disabled>Soal berikutnya →</button>
  </div>

  <!-- RESULT -->
  <div id="result-screen" class="hidden">
    <div class="card text-center">
      <div class="result-circle"><div class="result-score" id="result-score"></div></div>
      <h2 id="result-title" style="margin:0 0 6px;"></h2>
      <p class="text-muted" id="result-sub"></p>
      <p class="text-muted" style="font-size:12px;">Nilai ini tersimpan untuk kamu — hanya admin yang bisa melihat rekap lengkap.</p>
    </div>

    <div class="card">
      <strong style="font-size:14px; display:block; margin-bottom:12px;">Review jawaban</strong>
      <div id="review-list"></div>
    </div>
  </div>

  <div id="error-state" class="hidden text-center" style="padding-top:40px;">
    <p class="text-muted">Link quiz tidak ditemukan atau tidak valid. Minta link baru ke admin.</p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/util.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
